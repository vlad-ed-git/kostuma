<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <!--
    Kostuma's one placeholder for every costume (docs/design-spec.md §9.2):
    a faceless hooded figure waiting for whoever wears the costume. Lit from
    behind in arterial red, a sodium streetlight through a window at the
    left, floor fog, film grain. Rendered by scripts/placeholder.mjs.
  -->
  <defs>
    <radialGradient id="rim" cx="600" cy="640" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#df2321" stop-opacity="0.62"/>
      <stop offset="0.35" stop-color="#b91319" stop-opacity="0.32"/>
      <stop offset="0.75" stop-color="#5b0b0d" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0d0907" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sodium" cx="170" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f99b39" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f99b39" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f99b39" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f99b39" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0907" stop-opacity="0"/>
      <stop offset="1" stop-color="#050303" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="void" cx="600" cy="440" r="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#030202"/>
    </radialGradient>
    <radialGradient id="vignette" cx="600" cy="700" r="980" gradientUnits="userSpaceOnUse">
      <stop offset="0.5" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="haze" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.94  0 0 0 0 0.91  0 0 0 0 0.85  2.4 0 0 0 -1.25"/>
    </filter>
    <path id="figure" d="M600 296C566 318 528 372 512 446c-9 46-26 90-66 124-38 34-56 118-62 224-8 150-28 376-62 666h556c-34-290-54-516-62-666-6-106-24-190-62-224-40-34-57-78-66-124-16-74-54-128-88-150Z"/>
  </defs>

  <rect width="1200" height="1500" fill="#0d0907"/>
  <rect width="1200" height="1500" fill="url(#rim)"/>
  <rect width="1200" height="1500" fill="url(#sodium)"/>
  <!-- The window the streetlight comes through, and its shaft of light. -->
  <g transform="skewY(-6)" filter="url(#soft)">
    <path d="M96 150h170v330H96z" fill="url(#window)"/>
    <path d="M178 150v330M96 300h170" stroke="#0d0907" stroke-width="10" opacity="0.8"/>
  </g>
  <path d="M96 140 266 122 760 1500H180Z" fill="#f99b39" opacity="0.035" filter="url(#haze)"/>

  <!-- Rim light: the silhouette's edge glowing, then the figure over it. -->
  <use href="#figure" fill="none" stroke="#df2321" stroke-width="10" filter="url(#glow)" opacity="0.9"/>
  <use href="#figure" fill="none" stroke="#f99b39" stroke-width="3" filter="url(#glow)" opacity="0.25"/>
  <use href="#figure" fill="#070504"/>
  <ellipse cx="600" cy="452" rx="50" ry="78" fill="url(#void)"/>

  <!-- Floor fog pooling around the hem. -->
  <rect y="1080" width="1200" height="420" fill="url(#floor)"/>
  <ellipse cx="600" cy="1250" rx="620" ry="70" fill="#ada396" opacity="0.05" filter="url(#haze)"/>
  <ellipse cx="600" cy="1400" rx="560" ry="120" fill="#b91319" opacity="0.22" filter="url(#haze)"/>
  <ellipse cx="360" cy="1380" rx="420" ry="110" fill="#ada396" opacity="0.14" filter="url(#haze)"/>
  <ellipse cx="880" cy="1430" rx="420" ry="110" fill="#ada396" opacity="0.12" filter="url(#haze)"/>

  <rect width="1200" height="1500" fill="url(#vignette)"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.12"/>
</svg>
