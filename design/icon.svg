<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Kostuma's icon: the wordmark's o, a drop of blood, glowing on the
       night's black (spec §2.1). `npm run images` renders it. -->
  <defs>
    <radialGradient id="glow" cx="32" cy="40" r="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C80F1F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#C80F1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blood" x1="32" y1="8" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F03740"/>
      <stop offset="1" stop-color="#A80B19"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07080B"/>
  <circle cx="32" cy="40" r="26" fill="url(#glow)"/>
  <path d="M32 7C32 7 16 27 16 40.5a16 16 0 0 0 32 0C48 27 32 7 32 7Z" fill="url(#blood)"/>
  <ellipse cx="25.5" cy="40" rx="3.2" ry="6" transform="rotate(-18 25.5 40)" fill="#FFFFFF" fill-opacity="0.32"/>
</svg>
